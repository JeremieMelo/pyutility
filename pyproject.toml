[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "torchonn-pyutils"
version = "0.0.3.2"
description = "A collection of utility functions and modules for PyTorch and general Python usage."
authors = [
    { name = "JeremieMelo" }
]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.26.0",
    "tqdm>=4.56.0",
    "setuptools>=69.0.0",
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "matplotlib>=3.8.0",
    "svglib>=1.1.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    "pyyaml>=5.1.1",
    "ryaml>=0.4.0",
    "multimethod>=1.12",
    "scienceplots>=2.1.1",
]

[project.optional-dependencies]
tf = ["tensorflow>=2.16.0"]
full = ["tensorflow>=2.16.0"]

[project.urls]
Homepage = "https://github.com/JeremieMelo/pyutility"

[tool.setuptools]
packages = { find = { where = ["."], include = ["pyutils*"] } }
